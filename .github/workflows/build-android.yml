name: Build EchoHalo Spatial Compass APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'spatial_v050/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: echohalo-spatial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore verified v0.4.1 source and overlay v0.5.0
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT='57b359199ac1e557ea861603905df6033beab042'
          EXPECTED_BASE_SHA='d3f632fee53b07108f3a59d701bc1c7d1efb092dd3e1055b1d1a62168dd420a3'
          ZIP="$RUNNER_TEMP/echohalo-v041.zip"
          PROJECT="$RUNNER_TEMP/echohalo-source"
          JAVA_DIR="$PROJECT/app/src/main/java/org/neocities/bk26/echohalospatial"

          git show "$BASE_COMMIT:EchoHalo_Spatial_Source_v0.1.1.zip" > "$ZIP"
          ACTUAL_BASE_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Recovered base ZIP SHA-256: $ACTUAL_BASE_SHA"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA" || { echo "::error::Known-good base ZIP hash mismatch"; exit 1; }

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"
          unzip -q "$ZIP" -d "$PROJECT"

          cp spatial_v050/MainActivity.java "$JAVA_DIR/MainActivity.java"
          cp spatial_v050/CompassView.java "$JAVA_DIR/CompassView.java"
          python3 spatial_v050/patch_engine.py "$PROJECT"

          grep -q "versionName '0.5.0'" "$PROJECT/app/build.gradle" || { echo "::error::v0.5.0 version missing"; exit 1; }
          grep -q 'class CompassView' "$JAVA_DIR/CompassView.java" || { echo "::error::CompassView missing"; exit 1; }
          grep -q 'calibrationSnapCount' "$JAVA_DIR/SpatialAudioEngine.java" || { echo "::error::snap calibration missing"; exit 1; }
          grep -q 'latestAcceptedClassification = result' "$JAVA_DIR/SpatialAudioEngine.java" || { echo "::error::accepted-result fix missing"; exit 1; }

          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$PROJECT/app/build.gradle" | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$PROJECT/app/build.gradle" | head -n 1)

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building EchoHalo Spatial Compass v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
          validate-wrappers: false

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ steps.source.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK" || { echo "::error::app-debug.apk was not found"; exit 1; }
          OUT="$RUNNER_TEMP/EchoHalo-Spatial-Compass-v${{ steps.source.outputs.version_name }}-debug.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $(sha256sum "$OUT" | awk '{print $1}')"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHalo-Spatial-Compass-v${{ steps.source.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spatial-compass-v${{ steps.source.outputs.version_name }}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" '${{ steps.apk.outputs.apk }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EchoHalo Spatial Compass v${{ steps.source.outputs.version_name }}" \
            --notes "Upright normal-use Spatial Compass prototype. Finger-snap calibration, pose check, continuous border dot, sound-intensity sizing, and hidden diagnostics."

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## EchoHalo Spatial Compass build'
            echo
            echo '- App version: **v${{ steps.source.outputs.version_name }}**'
            echo '- Version code: `${{ steps.source.outputs.version_code }}`'
            echo '- Artifact: **EchoHalo-Spatial-Compass-v${{ steps.source.outputs.version_name }}**'
            echo '- Default pose: portrait, screen facing user, nearly vertical'
            echo '- Calibration: 3 detected snap bursts per cardinal direction'
            echo '- Display: continuous posterior-vector dot with RMS-driven size'
          } >> "$GITHUB_STEP_SUMMARY"
