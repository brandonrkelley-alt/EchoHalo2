name: Build EchoHalo Spatial Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: echohalo-spatial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore known-good v0.4.1 source and apply v0.4.2 fix
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT='57b359199ac1e557ea861603905df6033beab042'
          EXPECTED_BASE_SHA='d3f632fee53b07108f3a59d701bc1c7d1efb092dd3e1055b1d1a62168dd420a3'
          ZIP="$RUNNER_TEMP/echohalo-v041.zip"
          PROJECT="$RUNNER_TEMP/echohalo-source"

          git show "$BASE_COMMIT:EchoHalo_Spatial_Source_v0.1.1.zip" > "$ZIP"
          ACTUAL_BASE_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Recovered base ZIP SHA-256: $ACTUAL_BASE_SHA"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA" || { echo "::error::Known-good base ZIP hash mismatch"; exit 1; }

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"
          unzip -q "$ZIP" -d "$PROJECT"

          cat > "$RUNNER_TEMP/v042.patch" <<'PATCH'
          --- a/app/build.gradle
          +++ b/app/build.gradle
          @@ -10,7 +10,7 @@
                   applicationId 'org.neocities.bk26.echohalospatial'
                   minSdk 28
                   targetSdk 35
          -        versionCode 6
          -        versionName '0.4.1'
          +        versionCode 7
          +        versionName '0.4.2'
               }
           }
          --- a/app/src/main/java/org/neocities/bk26/echohalospatial/MainActivity.java
          +++ b/app/src/main/java/org/neocities/bk26/echohalospatial/MainActivity.java
          @@ -28,7 +28,7 @@
           import java.util.Map;
           
           public class MainActivity extends Activity implements SpatialAudioEngine.Listener {
          -    private static final String VERSION = "0.4.1";
          +    private static final String VERSION = "0.4.2";
               private static final int REQ_MIC = 81;
           
               private SpatialAudioEngine engine;
          @@ -80,7 +80,7 @@
                   sub.setPadding(0, dp(2), 0, dp(14));
                   root.addView(sub);
           
          -        root.addView(card("PURPOSE\nProve whether Samsung's public two-channel CAMCORDER stream can repeatedly identify LEFT / FRONT / RIGHT / BEHIND from acoustic evidence alone. v0.4.1 keeps the learned four-way fingerprint and adds ground-truth scoring, a confusion matrix, runner-up probabilities, and live lag history.", 15, 0xFFFFD17A));
          +        root.addView(card("PURPOSE\nProve whether Samsung's public two-channel CAMCORDER stream can repeatedly identify LEFT / FRONT / RIGHT / BEHIND from acoustic evidence alone. v0.4.2 keeps the learned four-way fingerprint and fixes blind-trial capture so ACTUAL taps score the most recent accepted prediction that was actually presented, rather than a later rejected audio frame.", 15, 0xFFFFD17A));
           
                   statusView = text(engine.hasAllProfiles()
                           ? "Saved 4/4 calibration found. Start the microphone to begin the blind test."
          @@ -313,7 +313,9 @@
               private void recordTruth(SpatialAudioEngine.Direction actual) {
                   SpatialAudioEngine.BlindTrial t = engine.recordGroundTruth(actual);
                   if (t == null) {
          -            Toast.makeText(this, "No fresh accepted prediction yet. Let the arrow settle on a clear sound, then tap again.", Toast.LENGTH_LONG).show();
          +            lastTrialView.setText("NOT RECORDED  ·  no fresh accepted prediction. Let the arrow settle on a clear sound, then tap again.");
          +            lastTrialView.setTextColor(0xFFFFD17A);
          +            Toast.makeText(this, "Not recorded — wait for a fresh direction prediction, then tap again.", Toast.LENGTH_LONG).show();
                       return;
                   }
                   String result = t.isCorrect() ? "✓ CORRECT" : "✕ MISS";
          --- a/app/src/main/java/org/neocities/bk26/echohalospatial/SpatialAudioEngine.java
          +++ b/app/src/main/java/org/neocities/bk26/echohalospatial/SpatialAudioEngine.java
          @@ -62,6 +62,7 @@
               private final List<Feature> calibrationFrames = new ArrayList<>();
               private volatile Feature latestFeature;
               private volatile ClassificationResult latestClassification;
          +    private volatile ClassificationResult latestAcceptedClassification;
               private long lastRecordedClassificationNanos = Long.MIN_VALUE;
               private String routeSummary = "not started";
           
          @@ -82,6 +83,7 @@
               public void setLiveEnabled(boolean enabled) {
                   liveEnabled = enabled;
                   latestClassification = null;
          +        latestAcceptedClassification = null;
                   synchronized (smoothedPosteriors) { smoothedPosteriors.clear(); }
                   log("LIVE " + (enabled ? "ON" : "OFF"));
               }
          @@ -97,6 +99,7 @@
                   running = false;
                   liveEnabled = false;
                   latestClassification = null;
          +        latestAcceptedClassification = null;
                   synchronized (stateLock) {
                       calibrationTarget = null;
                       calibrationFrames.clear();
          @@ -128,11 +131,15 @@
                   e.apply();
                   synchronized (smoothedPosteriors) { smoothedPosteriors.clear(); }
                   latestClassification = null;
          +        latestAcceptedClassification = null;
                   log("CALIBRATION CLEARED");
               }
           
               public BlindTrial recordGroundTruth(Direction actual) {
          -        ClassificationResult r = latestClassification;
          +        // Score the most recent ACCEPTED result, not the most recent raw frame.
          +        // A rejected frame can arrive between the UI displaying an accepted arrow and
          +        // the user's tap; using latestClassification made apparently valid taps vanish.
          +        ClassificationResult r = latestAcceptedClassification;
                   long now = System.nanoTime();
                   if (!liveEnabled || r == null || !r.accepted || r.best == null) return null;
                   if (now - r.timestampNanos > MAX_TRUTH_AGE_NS) return null;
          @@ -350,6 +357,7 @@
                           true, answer, runner, avg[best], avg[second], confidence,
                           avg.clone(), distances, f, dtext, System.nanoTime());
                   latestClassification = result;
          +        latestAcceptedClassification = result;
                   main.post(() -> listener.onClassification(result));
               }
           
          @@ -414,12 +422,12 @@
           
               public String buildReport() {
                   StringBuilder b = new StringBuilder();
          -        b.append("EchoHalo Spatial Calibration Lab v0.4.1\n");
          +        b.append("EchoHalo Spatial Calibration Lab v0.4.2\n");
                   b.append("Device route: ").append(routeSummary).append("\n");
                   b.append("Sample rate: ").append(SAMPLE_RATE).append(" Hz\n");
                   b.append("Classifier features: GCC-style interchannel lag + low/mid/high interchannel level difference + peak correlation\n");
                   b.append("Classifier smoothing: 9 accepted-frame posterior moving average\n");
          -        b.append("Blind truth rule: latest accepted classification must be <1.5 s old; one ground-truth tap = one trial\n");
          +        b.append("Blind truth rule: most recent accepted classification must be <1.5 s old; rejected audio frames do not erase it; one ground-truth tap = one trial\n");
                   b.append("Orientation: phone flat, screen up; top edge=FRONT, right edge=RIGHT, bottom edge=BEHIND, left edge=LEFT\n\n");
                   b.append("CALIBRATION PROFILES\n");
                   for (Direction d : Direction.values()) {
          PATCH

          sed -i 's/^          //' "$RUNNER_TEMP/v042.patch"
          patch -d "$PROJECT" -p1 --forward < "$RUNNER_TEMP/v042.patch"

          test -f "$PROJECT/settings.gradle" || { echo "::error::Recovered source missing settings.gradle"; exit 1; }
          test -f "$PROJECT/app/build.gradle" || { echo "::error::Recovered source missing app/build.gradle"; exit 1; }
          grep -q "versionName '0.4.2'" "$PROJECT/app/build.gradle" || { echo "::error::v0.4.2 version patch did not apply"; exit 1; }
          grep -q 'latestAcceptedClassification' "$PROJECT/app/src/main/java/org/neocities/bk26/echohalospatial/SpatialAudioEngine.java" || { echo "::error::accepted-classification fix missing"; exit 1; }
          grep -q 'NOT RECORDED' "$PROJECT/app/src/main/java/org/neocities/bk26/echohalospatial/MainActivity.java" || { echo "::error::visible failed-tap feedback missing"; exit 1; }

          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$PROJECT/app/build.gradle" | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$PROJECT/app/build.gradle" | head -n 1)

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building EchoHalo Spatial Lab v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
          validate-wrappers: false

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ steps.source.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK" || { echo "::error::app-debug.apk was not found"; exit 1; }
          OUT="$RUNNER_TEMP/EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}-debug.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $(sha256sum "$OUT" | awk '{print $1}')"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spatial-lab-v${{ steps.source.outputs.version_name }}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" '${{ steps.apk.outputs.apk }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EchoHalo Spatial Lab v${{ steps.source.outputs.version_name }}" \
            --notes "Built from the verified v0.4.1 source archive at commit 57b359199ac1e557ea861603905df6033beab042 with the deterministic v0.4.2 blind-truth race fix applied in CI."

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## EchoHalo Spatial Lab build'
            echo
            echo '- App version: **v${{ steps.source.outputs.version_name }}**'
            echo '- Version code: `${{ steps.source.outputs.version_code }}`'
            echo '- Artifact: **EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}**'
            echo '- Base source: verified successful v0.4.1 commit'
            echo '- Patch: blind-truth accepted-classification race fix + visible NOT RECORDED feedback'
          } >> "$GITHUB_STEP_SUMMARY"
