name: Build EchoHalo Spatial Probe APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Unpack EchoHalo source
        run: |
          rm -rf project
          mkdir project
          unzip -q EchoHalo_Spatial_Source_v0.1.1.zip -d project
          echo "Project contents:"
          find project -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK
        run: gradle -p project --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk EchoHalo-Spatial-Probe-v0.1.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHalo-Spatial-Probe-v0.1.1
          path: EchoHalo-Spatial-Probe-v0.1.1-debug.apk
          if-no-files-found: error

      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spatial-probe-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" EchoHalo-Spatial-Probe-v0.1.1-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EchoHalo Spatial Probe Build ${GITHUB_RUN_NUMBER}" \
            --notes "Phone-installable debug APK generated by GitHub Actions for EchoHalo microphone-array testing."
