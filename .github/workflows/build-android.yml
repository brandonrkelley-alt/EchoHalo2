name: Build EchoHalo Spatial Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'EchoHalo_Spatial_Source_v0.1.1.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: echohalo-spatial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify and unpack current source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP='EchoHalo_Spatial_Source_v0.1.1.zip'
          PROJECT="$RUNNER_TEMP/echohalo-source"

          test -f "$ZIP" || { echo "::error::Missing $ZIP at repository root"; exit 1; }

          echo "Repository commit: $GITHUB_SHA"
          echo "Source ZIP size: $(stat -c%s "$ZIP") bytes"
          echo "Source ZIP SHA-256: $(sha256sum "$ZIP" | awk '{print $1}')"

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"
          unzip -q "$ZIP" -d "$PROJECT"

          test -f "$PROJECT/settings.gradle" || { echo "::error::ZIP does not contain settings.gradle"; exit 1; }
          test -f "$PROJECT/app/build.gradle" || { echo "::error::ZIP does not contain app/build.gradle"; exit 1; }

          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$PROJECT/app/build.gradle" | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$PROJECT/app/build.gradle" | head -n 1)

          test -n "$VERSION_NAME" || { echo "::error::Could not read versionName"; exit 1; }
          test -n "$VERSION_CODE" || { echo "::error::Could not read versionCode"; exit 1; }

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Building EchoHalo Spatial Lab v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK from freshly unpacked source
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK='${{ steps.source.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK" || { echo "::error::app-debug.apk was not found"; exit 1; }

          OUT="$RUNNER_TEMP/EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}-debug.apk"
          cp "$APK" "$OUT"

          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $(sha256sum "$OUT" | awk '{print $1}')"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spatial-lab-v${{ steps.source.outputs.version_name }}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" '${{ steps.apk.outputs.apk }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EchoHalo Spatial Lab v${{ steps.source.outputs.version_name }}" \
            --notes "Built from EchoHalo_Spatial_Source_v0.1.1.zip at commit $GITHUB_SHA. Source ZIP is freshly unpacked for every build."

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## EchoHalo Spatial Lab build'
            echo
            echo '- Commit: `${{ github.sha }}`'
            echo '- Source: `EchoHalo_Spatial_Source_v0.1.1.zip`'
            echo '- App version: **v${{ steps.source.outputs.version_name }}**'
            echo '- Version code: `${{ steps.source.outputs.version_code }}`'
            echo '- Artifact: **EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}**'
            echo
            echo 'The source is deleted from the runner and freshly unpacked from the current repository commit before every build.'
          } >> "$GITHUB_STEP_SUMMARY"
