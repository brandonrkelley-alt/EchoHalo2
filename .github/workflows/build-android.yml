name: Build EchoHalo Spatial Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: echohalo-spatial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore verified v0.4.1 source and make v0.4.2
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT='57b359199ac1e557ea861603905df6033beab042'
          EXPECTED_BASE_SHA='d3f632fee53b07108f3a59d701bc1c7d1efb092dd3e1055b1d1a62168dd420a3'
          ZIP="$RUNNER_TEMP/echohalo-v041.zip"
          PROJECT="$RUNNER_TEMP/echohalo-source"

          git show "$BASE_COMMIT:EchoHalo_Spatial_Source_v0.1.1.zip" > "$ZIP"
          ACTUAL_BASE_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Recovered base ZIP SHA-256: $ACTUAL_BASE_SHA"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA" || { echo "::error::Known-good base ZIP hash mismatch"; exit 1; }

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"
          unzip -q "$ZIP" -d "$PROJECT"

          PROJECT="$PROJECT" python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['PROJECT'])

          def replace_once(rel, old, new, label):
              path = root / rel
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              path.write_text(text.replace(old, new, 1))
              print(f"Applied: {label}")

          build = Path('app/build.gradle')
          main = Path('app/src/main/java/org/neocities/bk26/echohalospatial/MainActivity.java')
          engine = Path('app/src/main/java/org/neocities/bk26/echohalospatial/SpatialAudioEngine.java')

          replace_once(build,
              "        versionCode 6\n        versionName '0.4.1'",
              "        versionCode 7\n        versionName '0.4.2'",
              'version 0.4.2')

          replace_once(main,
              '    private static final String VERSION = "0.4.1";',
              '    private static final String VERSION = "0.4.2";',
              'UI version')

          replace_once(main,
              'v0.4.1 keeps the learned four-way fingerprint and adds ground-truth scoring, a confusion matrix, runner-up probabilities, and live lag history.',
              'v0.4.2 keeps the learned four-way fingerprint and fixes blind-trial capture so ACTUAL taps score the most recent accepted prediction that was actually presented.',
              'purpose text')

          replace_once(main,
              '            Toast.makeText(this, "No fresh accepted prediction yet. Let the arrow settle on a clear sound, then tap again.", Toast.LENGTH_LONG).show();\n            return;',
              '            lastTrialView.setText("NOT RECORDED  ·  no fresh accepted prediction. Let the arrow settle on a clear sound, then tap again.");\n            lastTrialView.setTextColor(0xFFFFD17A);\n            Toast.makeText(this, "Not recorded — wait for a fresh direction prediction, then tap again.", Toast.LENGTH_LONG).show();\n            return;',
              'visible failed-tap feedback')

          replace_once(engine,
              '    private volatile ClassificationResult latestClassification;\n    private long lastRecordedClassificationNanos',
              '    private volatile ClassificationResult latestClassification;\n    private volatile ClassificationResult latestAcceptedClassification;\n    private long lastRecordedClassificationNanos',
              'accepted prediction field')

          replace_once(engine,
              '        liveEnabled = enabled;\n        latestClassification = null;\n        synchronized (smoothedPosteriors)',
              '        liveEnabled = enabled;\n        latestClassification = null;\n        latestAcceptedClassification = null;\n        synchronized (smoothedPosteriors)',
              'live reset')

          replace_once(engine,
              '        running = false;\n        liveEnabled = false;\n        latestClassification = null;\n        synchronized (stateLock)',
              '        running = false;\n        liveEnabled = false;\n        latestClassification = null;\n        latestAcceptedClassification = null;\n        synchronized (stateLock)',
              'stop reset')

          replace_once(engine,
              '        synchronized (smoothedPosteriors) { smoothedPosteriors.clear(); }\n        latestClassification = null;\n        log("CALIBRATION CLEARED")',
              '        synchronized (smoothedPosteriors) { smoothedPosteriors.clear(); }\n        latestClassification = null;\n        latestAcceptedClassification = null;\n        log("CALIBRATION CLEARED")',
              'calibration reset')

          replace_once(engine,
              '        ClassificationResult r = latestClassification;\n        long now = System.nanoTime();',
              '        // Preserve the last accepted prediction across rejected/marginal frames so a visible\n        // direction cannot disappear in the milliseconds between display and ACTUAL tap.\n        ClassificationResult r = latestAcceptedClassification;\n        long now = System.nanoTime();',
              'truth capture source')

          replace_once(engine,
              '        latestClassification = result;\n        main.post(() -> listener.onClassification(result));\n    }\n\n    private double distanceSquared',
              '        latestClassification = result;\n        latestAcceptedClassification = result;\n        main.post(() -> listener.onClassification(result));\n    }\n\n    private double distanceSquared',
              'accepted prediction update')

          replace_once(engine,
              '        b.append("EchoHalo Spatial Calibration Lab v0.4.1\\n");',
              '        b.append("EchoHalo Spatial Calibration Lab v0.4.2\\n");',
              'report version')

          replace_once(engine,
              '        b.append("Blind truth rule: latest accepted classification must be <1.5 s old; one ground-truth tap = one trial\\n");',
              '        b.append("Blind truth rule: most recent accepted classification must be <1.5 s old; rejected audio frames do not erase it; one ground-truth tap = one trial\\n");',
              'report rule')
          PY

          test -f "$PROJECT/settings.gradle" || { echo "::error::Recovered source missing settings.gradle"; exit 1; }
          grep -q "versionName '0.4.2'" "$PROJECT/app/build.gradle" || { echo "::error::v0.4.2 version edit missing"; exit 1; }
          grep -q 'latestAcceptedClassification = result' "$PROJECT/app/src/main/java/org/neocities/bk26/echohalospatial/SpatialAudioEngine.java" || { echo "::error::accepted-classification fix missing"; exit 1; }
          grep -q 'NOT RECORDED' "$PROJECT/app/src/main/java/org/neocities/bk26/echohalospatial/MainActivity.java" || { echo "::error::visible failed-tap feedback missing"; exit 1; }

          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$PROJECT/app/build.gradle" | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$PROJECT/app/build.gradle" | head -n 1)

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building EchoHalo Spatial Lab v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
          validate-wrappers: false

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ steps.source.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK" || { echo "::error::app-debug.apk was not found"; exit 1; }
          OUT="$RUNNER_TEMP/EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}-debug.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $(sha256sum "$OUT" | awk '{print $1}')"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spatial-lab-v${{ steps.source.outputs.version_name }}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" '${{ steps.apk.outputs.apk }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EchoHalo Spatial Lab v${{ steps.source.outputs.version_name }}" \
            --notes "Built from the SHA-256 verified v0.4.1 source archive with deterministic v0.4.2 text edits applied in CI."

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## EchoHalo Spatial Lab build'
            echo
            echo '- App version: **v${{ steps.source.outputs.version_name }}**'
            echo '- Version code: `${{ steps.source.outputs.version_code }}`'
            echo '- Artifact: **EchoHalo-Spatial-Lab-v${{ steps.source.outputs.version_name }}**'
            echo '- Base: SHA-256 verified successful v0.4.1 source'
            echo '- v0.4.2: accepted-prediction blind-tap fix + visible NOT RECORDED feedback'
          } >> "$GITHUB_STEP_SUMMARY"
