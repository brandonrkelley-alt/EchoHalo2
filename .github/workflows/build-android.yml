name: Build EchoHalo Hybrid Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'hybrid_v110_payload_*.txt'
      - 'hybrid_v111/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: echohalo-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore verified spatial base and overlay EchoHalo hybrid
        id: source
        shell: bash
        run: |
          set -euo pipefail
          BASE_COMMIT='57b359199ac1e557ea861603905df6033beab042'
          EXPECTED_BASE_SHA='d3f632fee53b07108f3a59d701bc1c7d1efb092dd3e1055b1d1a62168dd420a3'
          EXPECTED_OVERLAY_SHA='ae930300583ab33d7b05240d0a853ccbed37a881e4f74ca27c273123636a6803'
          ZIP="$RUNNER_TEMP/echohalo-spatial-base.zip"
          PROJECT="$RUNNER_TEMP/echohalo-hybrid"
          OVERLAY="$RUNNER_TEMP/echohalo-overlay"
          PAYLOAD="$RUNNER_TEMP/hybrid_v110_payload.tgz"

          git show "$BASE_COMMIT:EchoHalo_Spatial_Source_v0.1.1.zip" > "$ZIP"
          ACTUAL_BASE_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "Recovered base ZIP SHA-256: $ACTUAL_BASE_SHA"
          test "$ACTUAL_BASE_SHA" = "$EXPECTED_BASE_SHA" || { echo "::error::Known-good base ZIP hash mismatch"; exit 1; }

          cat hybrid_v110_payload_00.txt hybrid_v110_payload_01.txt hybrid_v110_payload_02.txt hybrid_v110_payload_03.txt | base64 -d > "$PAYLOAD"
          ACTUAL_OVERLAY_SHA=$(sha256sum "$PAYLOAD" | awk '{print $1}')
          echo "Hybrid overlay SHA-256: $ACTUAL_OVERLAY_SHA"
          test "$ACTUAL_OVERLAY_SHA" = "$EXPECTED_OVERLAY_SHA" || { echo "::error::Hybrid overlay hash mismatch"; exit 1; }

          rm -rf "$PROJECT" "$OVERLAY"
          mkdir -p "$PROJECT" "$OVERLAY"
          unzip -q "$ZIP" -d "$PROJECT"
          tar -xzf "$PAYLOAD" -C "$OVERLAY"
          python3 "$OVERLAY/hybrid_v110/patch_project.py" "$PROJECT" "$OVERLAY"
          python3 hybrid_v111/mic_arbiter_patch.py "$PROJECT"

          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$PROJECT/app/build.gradle" | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$PROJECT/app/build.gradle" | head -n 1)
          grep -q 'https://bk26.neocities.org/EchoHalo/' "$PROJECT/app/src/main/java/org/neocities/bk26/echohalospatial/MainActivity.java" || { echo "::error::EchoHalo live UI URL missing"; exit 1; }
          grep -q 'Orientation Scout' "$PROJECT/app/src/main/assets/spatial_inject.js" || { echo "::error::Spatial UI injection missing"; exit 1; }
          grep -q 'microphone arbiter' "$PROJECT/app/src/main/assets/spatial_inject.js" || { echo "::error::v1.1.1 microphone arbiter missing"; exit 1; }

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building EchoHalo Hybrid v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
          validate-wrappers: false

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.source.outputs.project }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ steps.source.outputs.project }}/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK" || { echo "::error::app-debug.apk not found"; exit 1; }
          OUT="$RUNNER_TEMP/EchoHalo-v${{ steps.source.outputs.version_name }}-hybrid-debug.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $(sha256sum "$OUT" | awk '{print $1}')"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoHalo-v${{ steps.source.outputs.version_name }}-Hybrid
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="echohalo-v${{ steps.source.outputs.version_name }}-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" '${{ steps.apk.outputs.apk }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EchoHalo v${{ steps.source.outputs.version_name }} Hybrid" \
            --notes "Full EchoHalo UI with native stereo Spatial Compass. v1.1.1 adds microphone arbitration so Voice Mirror, captions, browser audio, and native spatial capture no longer fight over the handset microphone. Browser-only hardware probes are disabled in the native shell."

      - name: Build summary
        shell: bash
        run: |
          {
            echo '## EchoHalo Hybrid Android build'
            echo
            echo '- App version: **v${{ steps.source.outputs.version_name }}**'
            echo '- Version code: `${{ steps.source.outputs.version_code }}`'
            echo '- Native 48 kHz stereo Spatial Compass bridge'
            echo '- Orientation Scout: portrait + two upright landscape poses'
            echo '- Microphone arbitration between native spatial capture and WebView audio features'
            echo '- Browser-only hardware probes disabled in the native shell'
          } >> "$GITHUB_STEP_SUMMARY"
