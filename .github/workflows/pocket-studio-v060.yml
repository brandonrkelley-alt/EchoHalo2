name: Build Pocket Studio v0.6.0 APK

on:
  push:
    branches: [pocket-studio-v053-build]
    paths:
      - pocket_studio_v060_source.b64
      - .github/workflows/pocket-studio-v060.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated Pocket Studio build branch
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;34.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Recover and verify Pocket Studio source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode pocket_studio_v060_source.b64 > "$RUNNER_TEMP/pocket-v060.tar.xz"
          echo "3533dde696fad3c9f6f74ee07837b3336e03a4e598f0433573ea040d51854898  $RUNNER_TEMP/pocket-v060.tar.xz" | sha256sum -c -
          mkdir -p pocket-studio
          tar -xJf "$RUNNER_TEMP/pocket-v060.tar.xz" -C pocket-studio
          test -f pocket-studio/app/src/main/java/com/pocketstudio/app/core/ModelCapabilities.java
          grep -q "versionName '0.6.0'" pocket-studio/app/build.gradle
          grep -q 'VERSION_NAME = "0.6.0"' pocket-studio/scripts/build_with_sdk.py
      - name: Compile and sign Android APK
        working-directory: pocket-studio
        run: python3 scripts/build_with_sdk.py --sdk "$ANDROID_HOME" --allow-new-signing-key
      - name: Verify package and Java contract tests
        shell: bash
        working-directory: pocket-studio
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/Pocket_Studio_v0_6_0_debug.apk | head -n 4
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/Pocket_Studio_v0_6_0_debug.apk | grep -E "versionCode='11'.*versionName='0.6.0'"
          java -jar "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" verify --verbose dist/Pocket_Studio_v0_6_0_debug.apk
          mkdir -p "$RUNNER_TEMP/java-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/java-tests" \
            app/src/main/java/com/pocketstudio/app/core/{Json,ModelCapabilities,ImageGeometry,PixelOps,HistoryOps,SseParser,LocalDreamClient,RemoteHostController,PromptAssist}.java \
            tests/{CoreImageTests,ClientContractTests,RemoteHostControllerTests,LibraryHistoryTests,PromptAssistTests,ModelCapabilitiesTests}.java
          for test in CoreImageTests ClientContractTests RemoteHostControllerTests LibraryHistoryTests PromptAssistTests ModelCapabilitiesTests; do
            java -cp "$RUNNER_TEMP/java-tests" "$test"
          done
      - name: Upload installable APK and hash
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Studio-v0.6.0-Android-APK
          path: |
            pocket-studio/dist/Pocket_Studio_v0_6_0_debug.apk
            pocket-studio/dist/Pocket_Studio_v0_6_0_debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
