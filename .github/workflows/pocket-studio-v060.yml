name: Pocket Studio v0.6.2 Android APK
on:
  push:
    branches:
      - pocket-studio-v062-performance
    paths:
      - 'pocket_studio_v060_v2_payload_*.txt'
      - 'pocket_studio_v061_repair_patch.py'
      - 'pocket_studio_v062_performance_patch.py'
      - '.github/workflows/pocket-studio-v060.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Pocket Studio build branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;34.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Restore and verify v0.6.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat pocket_studio_v060_v2_payload_0{0,1,2,3}.txt | base64 --decode > "$RUNNER_TEMP/pocket-v060.tar.xz"
          echo "3533dde696fad3c9f6f74ee07837b3336e03a4e598f0433573ea040d51854898  $RUNNER_TEMP/pocket-v060.tar.xz" | sha256sum -c -
          mkdir -p pocket-studio
          tar -xJf "$RUNNER_TEMP/pocket-v060.tar.xz" -C pocket-studio
          test -f pocket-studio/app/src/main/java/com/pocketstudio/app/core/ModelCapabilities.java
          grep -q "versionName '0.6.0'" pocket-studio/app/build.gradle
      - name: Upload verified source for patch audit
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Studio-v060-verified-source
          path: ${{ runner.temp }}/pocket-v060.tar.xz
          if-no-files-found: error
          retention-days: 7
      - name: Apply v0.6.1 orientation and editing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 pocket_studio_v061_repair_patch.py pocket-studio
          grep -q "versionName '0.6.1'" pocket-studio/app/build.gradle
      - name: Apply v0.6.2 model defaults and timing
        shell: bash
        run: |
          set -euo pipefail
          python3 pocket_studio_v062_performance_patch.py pocket-studio
          grep -q "versionName '0.6.2'" pocket-studio/app/build.gradle
      - name: Run Java contract and capability tests
        shell: bash
        working-directory: pocket-studio
        run: |
          set -euo pipefail
          mkdir -p build/test-classes
          javac -encoding UTF-8 -d build/test-classes \
            app/src/main/java/com/pocketstudio/app/core/{Json,ImageGeometry,PixelOps,HistoryOps,SseParser,LocalDreamClient,RemoteHostController,PromptAssist,ModelCapabilities}.java \
            tests/{CoreImageTests,ClientContractTests,RemoteHostControllerTests,LibraryHistoryTests,PromptAssistTests,ModelCapabilitiesTests}.java
          for test in CoreImageTests ClientContractTests RemoteHostControllerTests LibraryHistoryTests PromptAssistTests ModelCapabilitiesTests; do
            java -cp build/test-classes "$test"
          done
      - name: Compile and sign Pocket Studio APK
        shell: bash
        working-directory: pocket-studio
        run: |
          set -euo pipefail
          python3 scripts/build_with_sdk.py --sdk "$ANDROID_HOME" --allow-new-signing-key
      - name: Verify package metadata and checksum
        shell: bash
        working-directory: pocket-studio
        run: |
          set -euo pipefail
          APK=dist/Pocket_Studio_v0_6_2_debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "package:.*versionCode='13'.*versionName='0.6.2'"
          java -jar "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" verify --verbose "$APK"
          (cd dist && sha256sum -c Pocket_Studio_v0_6_2_debug.apk.sha256)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Studio-v0.6.2-APK
          path: |
            pocket-studio/dist/Pocket_Studio_v0_6_2_debug.apk
            pocket-studio/dist/Pocket_Studio_v0_6_2_debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
